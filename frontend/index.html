<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motorcycle Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <main class="dashboard-shell">
    <section class="dashboard-card" aria-label="Motorcycle Dashboard">
      <header class="dashboard-header">
        <h1>Motorcycle Dashboard</h1>
      </header>

      <section class="camera-grid" id="camera-panel" aria-label="Camera feeds">
        <article class="camera-tile" id="camera-1" role="button" tabindex="0" aria-label="Camera 1 fullscreen">
          <span class="camera-label">Camera 1</span>
          <img class="camera-stream" id="camera-1-stream" src="" alt="Camera 1 stream" hidden />
          <div class="camera-actions">
            <button type="button" class="btn btn-info btn-sm camera-status" id="camera-1-status">
              <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.111-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2V5z"/></svg>
              <span id="camera-1-status-text">Offline</span>
              <span class="badge badge-light" id="camera-1-status-badge">none</span>
            </button>
            <button type="button" class="btn btn-primary btn-sm camera-snapshot" id="camera-1-snapshot">
              <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1v6zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2z"/><path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>
              Snapshot
            </button>
            <button type="button" class="btn btn-success btn-sm camera-recording" id="camera-1-recording">
              <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path class="rec-dot" d="M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
              <span class="rec-label">Recording</span>
            </button>
          </div>
        </article>
        <article class="camera-tile" id="camera-2" role="button" tabindex="0" aria-label="Camera 2 fullscreen">
          <span class="camera-label">Camera 2</span>
          <img class="camera-stream" id="camera-2-stream" src="" alt="Camera 2 stream" hidden />
          <div class="camera-actions">
            <button type="button" class="btn btn-info btn-sm camera-status" id="camera-2-status">
              <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M0 5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.983 1.738l3.11-1.382A1 1 0 0 1 16 4.269v7.462a1 1 0 0 1-1.406.913l-3.111-1.382A2 2 0 0 1 9.5 13H2a2 2 0 0 1-2-2V5z"/></svg>
              <span id="camera-2-status-text">Offline</span>
              <span class="badge badge-light" id="camera-2-status-badge">none</span>
            </button>
            <button type="button" class="btn btn-primary btn-sm camera-snapshot" id="camera-2-snapshot">
              <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M15 12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h1.172a3 3 0 0 0 2.12-.879l.83-.828A1 1 0 0 1 6.827 3h2.344a1 1 0 0 1 .707.293l.828.828A3 3 0 0 0 12.828 5H14a1 1 0 0 1 1 1v6zM2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4H2z"/><path d="M8 11a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5zm0 1a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></svg>
              Snapshot
            </button>
            <button type="button" class="btn btn-success btn-sm camera-recording" id="camera-2-recording">
              <svg class="cam-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/><path class="rec-dot" d="M11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/></svg>
              <span class="rec-label">Recording</span>
            </button>
          </div>
        </article>
      </section>

      <section class="speed-cluster" id="speed-panel" aria-label="Speed">
        <p class="speed-number" id="speed-value">72</p>
        <p class="speed-unit">km/h</p>
        <p class="speed-caption">SPEEDOMETER</p>
      </section>

      <section class="status-grid" id="status-panel" aria-label="Status row">
        <div class="status-item">
          <span class="status-label">RPM</span>
          <strong id="rpm-value">0</strong>
        </div>
        <div class="status-item">
          <span class="status-label">Fuel</span>
          <strong id="fuel-value">0%</strong>
        </div>
        <div class="status-item status-lock">
          <span class="status-label">GPS</span>
          <strong id="gps-value">LOCK</strong>
          <span class="status-sub" id="gps-coords">--</span>
        </div>
      </section>

      <section class="trip-row" id="trip-panel" aria-label="Trip summary">
        <div class="trip-metric">
          <span class="trip-label">Trip</span>
          <strong id="trip-value">12.3 km</strong>
        </div>
        <div class="trip-clock" id="clock-value">09:45 AM</div>
      </section>
    </section>
  </main>

  <!-- Fullscreen camera overlay -->
  <div class="camera-overlay" id="camera-overlay">
    <button class="camera-overlay-close" id="camera-overlay-close" aria-label="Close fullscreen">&times;</button>
    <img class="camera-overlay-img" id="camera-overlay-img" src="" alt="Camera 1 fullscreen" />
    <p class="camera-overlay-state" id="camera-overlay-state">Offline</p>
  </div>

  <script src="js/websocket.js"></script>
  <script src="js/speedometer.js"></script>
  <script src="js/trip.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
